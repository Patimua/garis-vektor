<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">

<meta name="theme-color" content="#2b2f36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Garis Vektor</title>

<link rel="manifest" href="manifest.webmanifest">

<style>
/* Layout follows the classic desktop design-app shell: menu bar, control bar, tool column left, document tab + rulers + pasteboard centre, tabbed panel dock right, status bar bottom. */
:root{
  color-scheme:dark;
  --chrome:#323232; --chrome-2:#3d3d3d; --chrome-3:#4a4a4a; --hdr:#282828; --field:#1e1e1e; --line:#1f1f1f; --line-2:#4b4b4b;
  --fg:#e3e3e3; --muted:#9d9d9d; --accent:#378ef0; --accent-fg:#fff; --accent-soft:rgba(55,142,240,.22);
  --paste:#262626; --guide:#25d0ff; --smart:#ff3fa4; --margin:#e040d0; --column:#8a5cff; --danger:#ff5f52;
  --ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
html[data-ui="mdark"]{--chrome:#535353;--chrome-2:#606060;--chrome-3:#6b6b6b;--hdr:#474747;--field:#3b3b3b;--line:#3e3e3e;--line-2:#707070;--fg:#f2f2f2;--muted:#c8c8c8;--paste:#454545}
html[data-ui="mlight"]{color-scheme:light;--chrome:#b8b8b8;--chrome-2:#c7c7c7;--chrome-3:#d3d3d3;--hdr:#a8a8a8;--field:#ececec;--line:#9a9a9a;--line-2:#8a8a8a;--fg:#141414;--muted:#3e3e3e;--paste:#9d9d9d}
html[data-ui="light"]{color-scheme:light;--chrome:#f0f0f0;--chrome-2:#e3e3e3;--chrome-3:#d6d6d6;--hdr:#e0e0e0;--field:#ffffff;--line:#d0d0d0;--line-2:#b3b3b3;--fg:#1b1b1b;--muted:#5b5b5b;--paste:#d4d4d4}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--chrome);color:var(--fg);font:12px/1.35 var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{position:fixed;inset:0;display:grid;grid-template-rows:30px 36px minmax(0,1fr) 22px 24px;grid-template-columns:44px minmax(0,1fr) 288px;grid-template-areas:"menu menu menu" "ctl ctl ctl" "tools stage dock" "pal pal pal" "status status status"}

/* ---------- menu bar ---------- */
#menubar{grid-area:menu;display:flex;align-items:center;background:var(--hdr);border-bottom:1px solid var(--line);padding:0 6px 0 4px;min-width:0;gap:4px}
.logo{width:28px;height:22px;display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;display:block}
#menus{display:flex;min-width:0;overflow-x:auto;scrollbar-width:none}
#menus::-webkit-scrollbar{display:none}
.mbtn{background:none;border:0;padding:4px 8px;border-radius:3px;color:var(--fg);white-space:nowrap}
.mbtn:hover,.mbtn.open{background:var(--chrome-3)}
.mb-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.wsbtn{display:flex;align-items:center;gap:6px;background:var(--chrome-2);border:1px solid var(--line-2);border-radius:3px;padding:2px 8px;height:22px;white-space:nowrap}
.wsbtn svg{width:12px;height:12px}
#panelToggle{display:none}
/* dropdowns (menus, flyouts, context menu, popovers) */
.dd{position:fixed;min-width:220px;background:var(--chrome-2);border:1px solid var(--line-2);border-radius:4px;padding:4px 0;box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:300;max-height:calc(100vh - 40px);overflow-y:auto}
.mi{display:grid;grid-template-columns:18px 1fr auto 12px;align-items:center;gap:6px;width:100%;background:none;border:0;text-align:left;padding:4px 10px 4px 6px;color:var(--fg);white-space:nowrap}
.mi .ck{font-size:11px;text-align:center}
.mi kbd{font:11px var(--ui);color:var(--muted);padding-left:18px}
.mi .ar{font-size:9px;color:var(--muted)}
.mi:hover,.mi.hot{background:var(--accent);color:var(--accent-fg)}
.mi:hover kbd,.mi.hot kbd,.mi:hover .ar,.mi.hot .ar{color:inherit}
.mi[disabled]{color:var(--muted);opacity:.55;pointer-events:none}
.dd hr{border:0;border-top:1px solid var(--line-2);margin:4px 0}
.dd .mh{padding:4px 12px 2px;color:var(--muted);font-size:11px}

/* ---------- control bar ---------- */
#ctlbar{grid-area:ctl;display:flex;align-items:center;gap:8px;background:var(--chrome);border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin}
#ctlbar .tname{font-weight:600;min-width:84px}
#ctlbar .hint{color:var(--muted)}
#ctlbar label{display:flex;align-items:center;gap:5px;color:var(--muted)}
#ctlbar .sep{width:1px;height:20px;background:var(--line-2);flex:none}
.chip{width:22px;height:18px;border:1px solid var(--line-2);border-radius:2px;padding:0;position:relative;flex:none;overflow:hidden;background:#fff}
.chip.stroke::after{content:"";position:absolute;inset:4px;background:var(--chrome);border:1px solid var(--line-2)}
.chip.none{background:#fff!important}
.chip.none::before{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:2px;background:#e33;transform:rotate(-38deg);z-index:1}
.btn{background:var(--chrome-2);border:1px solid var(--line-2);border-radius:3px;padding:2px 9px;color:var(--fg);height:22px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.sm{height:20px;padding:0 7px;font-size:11px}
.ib{width:24px;height:22px;display:inline-grid;place-items:center;background:none;border:1px solid transparent;border-radius:3px;padding:0;color:var(--fg);flex:none}
.ib:hover{background:var(--chrome-3)}
.ib.on{background:var(--accent-soft);border-color:var(--accent)}
.ib svg{width:16px;height:16px}
input[type=number],input[type=text],select,textarea{background:var(--field);border:1px solid var(--line-2);border-radius:2px;padding:2px 5px;min-width:0;height:22px}
textarea{height:auto}
input[type=number]{width:58px;font-size:11px;font-variant-numeric:tabular-nums}
select{padding:1px 3px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
input[type=range]{accent-color:var(--accent);min-width:0;height:16px}
input[type=checkbox]{accent-color:var(--accent);margin:0}

/* ---------- tools ---------- */
#tools{grid-area:tools;background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 8px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.tgrip{width:26px;height:6px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);margin:0 0 4px;opacity:.6;flex:none}
.tool{width:32px;height:28px;display:grid;place-items:center;background:none;border:0;border-radius:3px;color:var(--fg);position:relative;flex:none}
.tool svg{width:18px;height:18px}
.tool:hover{background:var(--chrome-3)}
.tool.on{background:var(--hdr);box-shadow:inset 0 0 0 1px var(--line-2)}
html[data-ui="light"] .tool.on,html[data-ui="mlight"] .tool.on{background:#fff}
.tool.grp::after{content:"";position:absolute;right:2px;bottom:2px;border:2.5px solid transparent;border-right-color:var(--muted);border-bottom-color:var(--muted)}
.tip{position:fixed;background:#111;color:#fff;padding:3px 8px;border-radius:3px;white-space:nowrap;pointer-events:none;z-index:400;font-size:11px}
.tdiv{width:24px;border-top:1px solid var(--line-2);margin:4px 0;flex:none}
#fs{position:relative;width:38px;height:40px;margin-top:6px;flex:none}
.fsq{position:absolute;width:24px;height:24px;border:1px solid var(--line-2);overflow:hidden;cursor:pointer}
.fsq input{position:absolute;inset:-6px;width:40px;height:40px;opacity:0;cursor:pointer}
#fsFill{left:1px;top:0;z-index:2;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#fsStroke{left:13px;top:14px;z-index:1}
#fs.tstroke #fsStroke{z-index:3}
#fsStroke::after{content:"";position:absolute;inset:6px;background:var(--chrome);border:1px solid var(--line-2);pointer-events:none}
.fsq.none{background:#fff!important}
.fsq.none::before{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:2px;background:#e33;transform:rotate(-45deg);pointer-events:none;z-index:1}
.minis{display:flex;gap:2px;flex:none;margin-top:2px}
.mini{width:15px;height:15px;padding:0;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:2px}
.mini:hover{color:var(--fg);background:var(--chrome-3)}
.mini svg{width:12px;height:12px}

/* ---------- stage ---------- */
#stage{grid-area:stage;position:relative;background:var(--paste);display:flex;flex-direction:column;min-width:0;min-height:0}
#doctabs{height:26px;flex:none;background:var(--hdr);display:flex;align-items:flex-end;padding-left:4px;border-bottom:1px solid var(--line)}
.dtab{display:flex;align-items:center;gap:8px;height:24px;padding:0 6px 0 12px;background:var(--chrome);border:1px solid var(--line);border-bottom:0;border-radius:3px 3px 0 0;max-width:100%;min-width:0}
.dtab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.dtab .dx{background:none;border:0;color:var(--muted);font-size:14px;line-height:1;padding:0 3px}
.dtab .dx:hover{color:var(--fg)}
.dplus{width:24px;height:22px;margin:0 0 1px 4px;background:none;border:1px solid transparent;border-radius:3px;color:var(--muted);font-size:17px;line-height:1;padding:0;display:grid;place-items:center}
.dplus:hover{color:var(--fg);background:var(--chrome-3);border-color:var(--line-2)}
#canvasWrap{position:relative;flex:1;min-height:0;overflow:hidden}
#canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#canvasWrap.rulers #canvas{left:18px;top:18px;width:calc(100% - 18px);height:calc(100% - 18px)}
.ruler{position:absolute;background:var(--chrome);display:none;z-index:4}
#canvasWrap.rulers .ruler{display:block}
#rulerH{left:18px;top:0;height:18px;width:calc(100% - 18px);cursor:s-resize;border-bottom:1px solid var(--line)}
#rulerV{left:0;top:18px;width:18px;height:calc(100% - 18px);cursor:e-resize;border-right:1px solid var(--line)}
#rulerC{left:0;top:0;width:18px;height:18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#stage.c-select #canvas,#stage.c-direct #canvas{cursor:default}
#stage.c-pen #canvas,#stage.c-pencil #canvas,#stage.c-rect #canvas,#stage.c-ellipse #canvas,#stage.c-line #canvas,#stage.c-polygon #canvas,#stage.c-star #canvas,#stage.c-eyedrop #canvas,#stage.c-frame #canvas,#stage.c-crop #canvas,#stage.c-artboard #canvas,#stage.c-rotate #canvas,#stage.c-scale #canvas,#stage.c-reflect #canvas{cursor:crosshair}
#stage.c-brush #canvas,#stage.c-eraser #canvas,#stage.c-restore #canvas{cursor:none}
#stage.c-magic #canvas,#stage.c-blend #canvas{cursor:crosshair}
#stage.c-pathtype #canvas{cursor:text}
#areaBar{position:absolute;z-index:7;display:flex;align-items:center;gap:3px;background:var(--chrome-2);border:1px solid var(--line-2);border-radius:5px;padding:3px 5px;box-shadow:0 4px 16px rgba(0,0,0,.4);white-space:nowrap}
#areaBar button{background:none;border:1px solid transparent;border-radius:3px;color:var(--fg);height:24px;min-width:24px;padding:0 6px;display:inline-grid;place-items:center;font-size:11.5px}
#areaBar button:hover{background:var(--chrome-3)}
#areaBar button.on{background:var(--accent-soft);border-color:var(--accent)}
#areaBar .abs{width:1px;height:18px;background:var(--line-2);margin:0 2px}
#areaBar .abdone{background:var(--accent)!important;color:#fff!important;font-weight:600}
#areaBar select{height:24px}
.thread{fill:none;stroke:var(--accent);stroke-width:1.2px;stroke-dasharray:4 3;pointer-events:none}
.threadp{fill:var(--accent);stroke:#fff;stroke-width:1px;pointer-events:none}
.overset{cursor:pointer}
#stage.c-text #canvas{cursor:text}
#stage.c-zoom #canvas{cursor:zoom-in}
#stage.c-hand #canvas,#stage.space #canvas{cursor:grab}
#stage.panning #canvas{cursor:grabbing}
#textEdit{position:absolute;background:rgba(255,255,255,.94);color:#111;border:1px dashed var(--accent);padding:0 2px;outline:none;line-height:1.15;min-width:40px;z-index:6;border-radius:0;resize:none;overflow:hidden;white-space:pre;box-sizing:content-box}
#areaEdit{position:absolute;background:rgba(255,255,255,.96);color:#111;border:1px solid var(--accent);padding:0;outline:none;z-index:6;resize:none;border-radius:0;white-space:pre-wrap;overflow:hidden}
#content.outline-mode *{fill:none!important;stroke:#000!important;stroke-width:1px!important;vector-effect:non-scaling-stroke;filter:none!important;mix-blend-mode:normal!important;opacity:1!important}
#content.outline-mode image{opacity:.15!important}
#content.outline-mode text{fill:#000!important;stroke:none!important}
.outline{fill:none;stroke:var(--accent);stroke-width:1.2px;vector-effect:non-scaling-stroke;pointer-events:none}
.frame{fill:none;stroke:var(--accent);stroke-width:1px;pointer-events:none}
.keyobj{fill:none;stroke:var(--accent);stroke-width:3px;pointer-events:none}
.subframe{fill:none;stroke:var(--accent);stroke-width:1px;stroke-dasharray:3 3;pointer-events:none;opacity:.8}
.hdl{fill:#fff;stroke:var(--accent);stroke-width:1px}
.rot{fill:#fff;stroke:var(--accent);stroke-width:1.2px;cursor:grab}
.hline{stroke:var(--accent);stroke-width:1px;pointer-events:none}
.hnode{fill:var(--accent);stroke:#fff;stroke-width:1px;cursor:move}
.anode{fill:#fff;stroke:var(--accent);stroke-width:1.2px;cursor:move}
.anode.first{fill:var(--accent)}
.marq{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1px;stroke-dasharray:4 3;pointer-events:none}
.sguide{stroke:var(--smart);stroke-width:1px;pointer-events:none}
.uguide{stroke:var(--guide);stroke-width:1px;pointer-events:none}
.ghit{stroke:transparent;stroke-width:7px;cursor:move}
.penrb{fill:none;stroke:var(--accent);stroke-width:1px;vector-effect:non-scaling-stroke;stroke-dasharray:4 3;pointer-events:none}
#overlay .abplus{cursor:pointer;pointer-events:all}#overlay .abplus circle{fill:var(--accent);stroke:#fff;stroke-width:1.5;opacity:.85}#overlay .abplus path{stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round}#overlay .abplus:hover circle{opacity:1;r:13px}
.blabel{fill:var(--muted);font:11px var(--ui);cursor:pointer}
.blabel.on{fill:var(--fg);font-weight:600}
.fxline{stroke:#9aa0a8;stroke-width:1px;pointer-events:none;opacity:.8}
.overset{fill:#fff;stroke:#e22;stroke-width:1px}
.oversetp{stroke:#e22;stroke-width:1.4px}
.abframe{fill:none;stroke:var(--accent);stroke-width:1.5px;stroke-dasharray:6 3;pointer-events:none}
.cropshade{fill:rgba(0,0,0,.45);pointer-events:none;fill-rule:evenodd}
.brushc{fill:none;stroke:#fff;stroke-width:1px;pointer-events:none;mix-blend-mode:difference}
.lguide-m{fill:none;stroke:var(--margin);vector-effect:non-scaling-stroke;stroke-width:1px;pointer-events:none}
.lguide-c{stroke:var(--column);vector-effect:non-scaling-stroke;stroke-width:1px;pointer-events:none}

/* ---------- colour palette strip (left-click = fill, right-click = outline) ---------- */
#palette{grid-area:pal;background:var(--chrome);border-top:1px solid var(--line);display:flex;flex-direction:row;align-items:center;padding:0 6px;gap:1px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}  /* CorelDRAW-style colour strip along the bottom */
#palette::-webkit-scrollbar{display:none}
#palette button{width:20px;height:16px;flex:none;border:1px solid rgba(128,128,128,.4);padding:0;border-radius:1px}
#palette button:hover{outline:1px solid var(--fg);transform:scale(1.15);z-index:1}
#palette button.nonesw{background:#fff;position:relative;overflow:hidden}
#palette button.nonesw::before{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:2px;background:#e33;transform:rotate(-40deg)}
.stcol{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.stcol .chip{width:16px;height:14px}

/* ---------- dock ---------- */
#dock{grid-area:dock;background:var(--hdr);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-width:0;padding:2px 0}
.pg{background:var(--chrome);display:flex;flex-direction:column;flex:none;min-height:0}
.pg.grow{flex:1 1 auto;min-height:200px}
.pg.pprops{min-height:min(440px,58vh)}
.pg-h{display:flex;align-items:stretch;background:var(--hdr);height:24px;flex:none;padding-right:2px}
.ptab{background:none;border:0;padding:0 10px;color:var(--muted);font-size:11.5px;white-space:nowrap;border-right:1px solid var(--line)}
.ptab.on{background:var(--chrome);color:var(--fg);font-weight:600}
.ptab:hover{color:var(--fg)}
.pg-h .sp{flex:1}
.pg-h .pm{background:none;border:0;color:var(--muted);width:22px;padding:0;font-size:13px;line-height:1}
.pg-h .pm:hover{color:var(--fg)}
.pg.collapsed .pg-b{display:none}
.pg-b{overflow-y:auto;min-height:0;flex:1}
.pnl{padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px}
.psec{display:flex;flex-direction:column;gap:6px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.psec:last-child{border-bottom:0;padding-bottom:0}
.psec h4{margin:2px 0 0;font-size:11px;font-weight:600;color:var(--fg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px 8px}
.fld{display:flex;align-items:center;gap:5px;min-width:0}
.fld>span:first-child{min-width:14px;color:var(--muted);font-size:11px;flex:none}
.fld input[type=number],.fld input[type=text],.fld select{flex:1;width:auto;min-width:0}
.row{display:flex;align-items:center;gap:6px;min-width:0}
.row>.lbl{width:62px;color:var(--muted);flex:none}
.row select{flex:1}
.row input[type=range]{flex:1}
.swatch{position:relative;width:24px;height:20px;border:1px solid var(--line-2);border-radius:2px;overflow:hidden;flex:none;cursor:pointer}
.swatch input{position:absolute;inset:-6px;width:44px;height:40px;opacity:0;cursor:pointer}
.swatch.none{background:#fff!important}
.swatch.none::before{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:2px;background:#e33;transform:rotate(-30deg);pointer-events:none}
.swatch.stroke::after{content:"";position:absolute;inset:5px;background:var(--chrome);border:1px solid var(--line-2);pointer-events:none}
.hexin{width:70px!important;font-family:var(--mono);font-size:11px}
.chk{display:flex;align-items:center;gap:4px;color:var(--muted);cursor:pointer;white-space:nowrap}
.out{font-size:11px;width:36px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:4px;flex-wrap:wrap}
.ab{height:26px;min-width:26px;display:grid;place-items:center;background:var(--chrome-2);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;color:var(--fg)}
.ab:hover{border-color:var(--accent)}
.ab.on{background:var(--accent-soft);border-color:var(--accent)}
.ab svg{width:16px;height:16px}
.muted{color:var(--muted)}
.sw-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.sw-grid button{aspect-ratio:1;border:1px solid rgba(128,128,128,.35);padding:0;max-width:100%}
.sw-grid button:hover{outline:1px solid var(--fg);z-index:1}
.sw-grid button.nonesw{background:#fff;position:relative;overflow:hidden}

/* ---------- path model ---------- */
function penD(pts,closed){
  if(!pts.length) return '';
  const f=r2;
  let d=`M${f(pts[0].x)} ${f(pts[0].y)}`;
  const seg=(a,b)=>(!a.ox&&!a.oy&&!b.ix&&!b.iy)?` L${f(b.x)} ${f(b.y)}`:` C${f(a.x+(a.ox||0))} ${f(a.y+(a.oy||0))} ${f(b.x+(b.ix||0))} ${f(b.y+(b.iy||0))} ${f(b.x)} ${f(b.y)}`;
  for(let i=1;i<pts.length;i++) d+=seg(pts[i-1],pts[i]);
  if(closed&&pts.length>2) d+=seg(pts[pts.length-1],pts[0])+' Z';
  return d;
}
function parsePath(d){
  const tk=d.match(/[A-Za-z]|[-+]?(?:\d*\.\d+|\d+\.?\d*)(?:[eE][-+]?\d+)?/g); if(!tk) return null;
  const pts=[]; let i=0,cmd=null,cx=0,cy=0,closed=false;
  const num=()=>parseFloat(tk[i++]);
  while(i<tk.length){
    if(/^[A-Za-z]$/.test(tk[i])) cmd=tk[i++]; else if(!cmd) return null;
    const rel=cmd===cmd.toLowerCase(), C=cmd.toUpperCase();
    if(C==='Z'){closed=true; if(i<tk.length) return null; break;}
    if(C==='M'){ if(pts.length) return null; let x=num(),y=num(); if(rel){x+=cx;y+=cy} cx=x;cy=y; pts.push(P(x,y)); cmd=rel?'l':'L'; continue; }
    if(!pts.length) return null;
    const prev=pts[pts.length-1];
    if(C==='L'){let x=num(),y=num();if(rel){x+=cx;y+=cy}pts.push(P(x,y));cx=x;cy=y;}
    else if(C==='H'){let x=num();if(rel)x+=cx;pts.push(P(x,cy));cx=x;}
    else if(C==='V'){let y=num();if(rel)y+=cy;pts.push(P(cx,y));cy=y;}
    else if(C==='C'){const a=[num(),num(),num(),num(),num(),num()];if(rel){for(let k=0;k<6;k+=2){a[k]+=cx;a[k+1]+=cy}}prev.ox=a[0]-prev.x;prev.oy=a[1]-prev.y;const p=P(a[4],a[5]);p.ix=a[2]-a[4];p.iy=a[3]-a[5];pts.push(p);cx=a[4];cy=a[5];}
    else if(C==='Q'){const a=[num(),num(),num(),num()];if(rel){a[0]+=cx;a[1]+=cy;a[2]+=cx;a[3]+=cy}prev.ox=2/3*(a[0]-prev.x);prev.oy=2/3*(a[1]-prev.y);const p=P(a[2],a[3]);p.ix=2/3*(a[0]-a[2]);p.iy=2/3*(a[1]-a[3]);pts.push(p);cx=a[2];cy=a[3];}
    else return null;
  }
  if(pts.some(p=>[p.x,p.y,p.ix,p.iy,p.ox,p.oy].some(v=>!isFinite(v)))) return null;
  if(closed&&pts.length>2){const f=pts[0],l=pts[pts.length-1];if(Math.abs(f.x-l.x)<.01&&Math.abs(f.y-l.y)<.01){f.ix=l.ix;f.iy=l.iy;pts.pop();}}
  return {pts,closed};
}
function nodesOf(el){
  if(!el) return null; const t=el.tagName;
  if(t==='path'){ if(el.dataset.pts){try{return {pts:JSON.parse(el.dataset.pts),closed:el.dataset.closed==='1'}}catch(e){}} return parsePath(el.getAttribute('d')||''); }
  if(t==='polygon'||t==='polyline'){const n=(el.getAttribute('points')||'').trim().split(/[\s,]+/).map(Number);const pts=[];for(let i=0;i+1<n.length;i+=2)pts.push(P(n[i],n[i+1]));return {pts,closed:t==='polygon',poly:true};}

  return null;
}
function setNodes(el,nd){
  const t=el.tagName;
  if(t==='path'){
    el.dataset.pts=JSON.stringify(nd.pts.map(p=>({x:r2(p.x),y:r2(p.y),ix:r2(p.ix||0),iy:r2(p.iy||0),ox:r2(p.ox||0),oy:r2(p.oy||0)})));

  else if(t==='line'){el.setAttribute('x1',r2(nd.pts[0].x));el.setAttribute('y1',r2(nd.pts[0].y));el.setAttribute('x2',r2(nd.pts[1].x));el.setAttribute('y2',r2(nd.pts[1].y));}
}
function smoothHandles(pts,closed){
  const n=pts.length;
  pts.forEach((p,i)=>{
    const a=pts[i-1]||(closed?pts[n-1]:null), b=pts[i+1]||(closed?pts[0]:null);
    if(!a||!b){p.ix=p.iy=p.ox=p.oy=0;return;}
    const tx=(b.x-a.x)/6, ty=(b.y-a.y)/6; p.ox=tx;p.oy=ty;p.ix=-tx;p.iy=-ty;
  });
}

function drawRulers(){
  if(!opts.rulers) return;

function setFx(el,f){

function applyFx(el){
  const f=getFx(el); let fl=userDefs.querySelector('#fx-'+CSS.escape(el.id)); if(fl) fl.remove();
  if(fxEmpty(f)){el.removeAttribute('filter');return;}
  fl=mkNS('filter',{id:'fx-'+el.id,'color-interpolation-filters':'sRGB',filterUnits:'userSpaceOnUse'});
  let last='SourceGraphic', n=0;
  const add=(tag,attrs,kids)=>{const e=mkNS(tag,{...attrs,in:last,result:'r'+(++n)});(kids||[]).forEach(k=>e.appendChild(k));fl.appendChild(e);last='r'+n;};

  if(f.bri||f.con){ const c=1+f.con/100, i=0.5-0.5*c+f.bri/200; add('feComponentTransfer',{},ct({type:'linear',slope:r2(c),intercept:r2(i)})); }
  if(f.hue) add('feColorMatrix',{type:'hueRotate',values:f.hue});

  if(f.sharp){ const k=r2(f.sharp/100*0.7); add('feConvolveMatrix',{order:3,kernelMatrix:`0 ${-k} 0 ${-k} ${r2(1+4*k)} ${-k} 0 ${-k} 0`,preserveAlpha:'true'}); }

    const prev=last; fl.appendChild(mkNS('feImage',{href:'data:image/svg+xml;charset=utf-8,'+vs.replace(/#/g,'%23').replace(/</g,'%3C').replace(/>/g,'%3E'),x:r2(b.x),y:r2(b.y),width:r2(b.width),height:r2(b.height),preserveAspectRatio:'none',result:'vimg'}));
    fl.appendChild(mkNS('feComposite',{in:'vimg',in2:'SourceAlpha',operator:'in',result:'vin'})); fl.appendChild(mkNS('feComposite',{in:'vin',in2:prev,operator:'over',result:'r'+(++n)})); last='r'+n; } }
  if(f.glow) add('feDropShadow',{dx:0,dy:0,stdDeviation:f.glow.blur,'flood-color':f.glow.color,'flood-opacity':f.glow.op});
  if(f.shadow) add('feDropShadow',{dx:f.shadow.dx,dy:f.shadow.dy,stdDeviation:f.shadow.blur,'flood-color':f.shadow.color,'flood-opacity':f.shadow.op});
  userDefs.appendChild(fl); el.setAttribute('filter',`url(#fx-${el.id})`); fxRegion(el);
}
function fxRegion(el){

/* ---------- pathfinder (paper.js loaded on demand) ---------- */
const PAPER_URL='https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-core.min.js';
let pScope=null;
async function pathfinder(op){
  const els=sortDoc(sel).filter(el=>['path','rect','ellipse','circle','polygon','polyline'].includes(el.tagName)||isPlainGroup(el));
  if(els.length<2){toast('Select two or more shapes');return;}
  try{ await loadScript(PAPER_URL); }catch(e){ toast('Pathfinder library could not be loaded (offline?)'); return; }
  if(!pScope){ pScope=new paper.PaperScope(); pScope.setup(new paper.Size(10,10)); }
  pScope.activate(); pScope.project.clear();
  const toP=it=>{ if(!it) return null; if(it.className==='Group'||it.className==='Layer'){ let res=null; it.children.slice().forEach(ch=>{const q=toP(ch); if(q) res=res?res.unite(q,{insert:false}):q;}); return res; } if(it.className==='Shape') return it.toPath(false); if(it.className==='Path'||it.className==='CompoundPath') return it; return null; };
  const paths=els.map(el=>{ const c=el.cloneNode(true); c.removeAttribute('filter'); return toP(pScope.project.importSVG(c,{insert:false,expandShapes:true})); }).filter(Boolean);
  if(paths.length<2){toast('Those objects cannot be combined');return;}
  let res;
  try{
    if(op==='unite') res=paths.reduce((a,b)=>a.unite(b,{insert:false}));
    else if(op==='minus'){ const front=paths.slice(1).reduce((a,b)=>a.unite(b,{insert:false})); res=paths[0].subtract(front,{insert:false}); }
    else if(op==='intersect') res=paths.reduce((a,b)=>a.intersect(b,{insert:false}));
    else res=paths.reduce((a,b)=>a.exclude(b,{insert:false}));
  }catch(e){ toast('Pathfinder failed on these shapes'); return; }
  const d=res&&res.pathData; if(!d){ toast('The result is empty'); }
  const src=op==='minus'?els[0]:els[els.length-1], l=leafOf(src);
  const p=newEl('path',{d:d||'M0 0',fill:l.getAttribute('fill')||'#000',stroke:l.getAttribute('stroke'),'stroke-width':l.getAttribute('stroke-width'),opacity:src.getAttribute('opacity'),'fill-rule':op==='exclude'?'evenodd':null});
  els[els.length-1].after(p); els.forEach(el=>el.remove()); if(!d) p.remove();
  sel=d?[p]:[]; commit({unite:'Unite',minus:'Minus Front',intersect:'Intersect',exclude:'Exclude'}[op]);
}
async function simplifyPath(){
  const els=sel.filter(el=>el.tagName==='path'); if(!els.length){toast('Select a path');return;}
  try{ await loadScript(PAPER_URL); }catch(e){ toast('Library could not be loaded'); return; }
  if(!pScope){ pScope=new paper.PaperScope(); pScope.setup(new paper.Size(10,10)); } pScope.activate();
  els.forEach(el=>{ const pp=new paper.Path({pathData:el.getAttribute('d'),insert:false}); pp.simplify(2.5); delete el.dataset.pts; el.setAttribute('d',pp.pathData); const nd=parsePath(el.getAttribute('d')); if(nd) setNodes(el,nd); });
  commit('Simplify');
}

/* ---------- rasterize (vector → pixel layer) ---------- */
async function rasterize(){
  if(!sel.length){toast('Select artwork to rasterize');return;}
  const s=sortDoc(sel), b=selBox(); if(!b||!b.w||!b.h) return;
  const x=Math.floor(b.x)-2,y=Math.floor(b.y)-2,w=Math.ceil(b.w)+4,h=Math.ceil(b.h)+4;
  const str=`<svg xmlns="${NS}" xmlns:xlink="http://www.w3.org/1999/xlink" width="${w}" height="${h}" viewBox="${x} ${y} ${w} ${h}"><defs>${userDefs.innerHTML}</defs>${s.map(xmlOf).join('')}</svg>`;
  try{
    const r=await svgStrToPng(str,w*2,h*2);
    const el=newEl('image',{href:r.url,x,y,width:w,height:h,preserveAspectRatio:'none'},'pixel'); el.dataset.name=(s[s.length-1].dataset.name||'Layer')+' (raster)';
    s[s.length-1].after(el); s.forEach(n=>n.remove()); sel=[el]; commit('Rasterize');
  }catch(e){ toast('Rasterize failed'); }
}

const JSPDF_URL='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
async function exportPDF(fname,scale){
  toast('Building PDF…');
  try{ await loadScript(JSPDF_URL); }catch(e){ toast('PDF library could not be loaded (offline?)'); return; }
  const {jsPDF}=window.jspdf; let pdf=null;
  for(let i=0;i<doc.boards.length;i++){
    const b=doc.boards[i], {canvas}=await svgToPng(i,scale||2);
    const wpt=b.w*0.75, hpt=b.h*0.75, o=wpt>hpt?'l':'p';
    if(!pdf) pdf=new jsPDF({orientation:o,unit:'pt',format:[wpt,hpt],compress:true}); else pdf.addPage([wpt,hpt],o);
    pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,wpt,hpt);
  }
  download(pdf.output('blob'),fname+'.pdf');
}

function buildDD(list,x,y,level){
  $$('.dd').forEach(d=>{ if(+d.dataset.level>=level) d.remove(); });
  const dd=document.createElement('div'); dd.className='dd menu-dd'; dd.dataset.level=level;
  list.forEach((it,i)=>{
    if(it===SEP){ dd.appendChild(document.createElement('hr')); return; }
    const b=document.createElement('button'); b.type='button'; b.className='mi'; if(it.dis) b.disabled=true;
    b.innerHTML=`<span class="ck">${it.on?'✓':''}</span><span>${esc(it.l)}</span><kbd>${it.k||''}</kbd><span class="ar">${it.sub?'▶':''}</span>`;
    b.addEventListener('mouseenter',()=>{ dd.querySelectorAll('.mi.hot').forEach(h=>h.classList.remove('hot')); $$('.dd').forEach(d=>{if(+d.dataset.level>level)d.remove();}); if(it.sub){ b.classList.add('hot'); const r=b.getBoundingClientRect(); buildDD(it.sub,r.right-2,r.top-5,level+1); } });
    b.addEventListener('click',e=>{ e.stopPropagation(); if(it.sub) return; closeMenus(); if(it.fn) it.fn(); else if(it.c&&CMDS[it.c]) CMDS[it.c](); });
    dd.appendChild(b);
  });
  document.body.appendChild(dd);
  const w=dd.offsetWidth, h=dd.offsetHeight;
  if(x+w>window.innerWidth-4) x=level?Math.max(4,x-w-dd.parentElement.querySelector(`.dd[data-level="${level-1}"]`)?.offsetWidth+4||0):window.innerWidth-w-4;
  if(level&&x<4) x=4;
  dd.style.left=Math.max(4,x)+'px'; dd.style.top=Math.max(4,Math.min(y,window.innerHeight-h-4))+'px';
  return dd;
}

  if(sel.length>1) return [...new Set(sel.map(kindOf))].length===1?`${sel.length} × ${NAMES[kindOf(sel[0])]||kindOf(sel[0])}`:'Mixed Objects';
  return NAMES[kindOf(sel[0])]||kindOf(sel[0]);
}
function chipStyle(c){ return c==='none'?'':`background:${/^url/.test(c)?'linear-gradient(90deg,#fff,#000)':(toHex(c)||'#888')}`; }
/* small unit switcher shown beside measurement fields */
const unitPick=()=>`<select class="upick" data-upick title="Measurement units">${Object.keys(UNITS).map(k=>`<option value="${k}" ${k===opts.units?'selected':''}>${UNITS[k].l}</option>`).join('')}</select>`;
function setUnits(k){ if(!UNITS[k]) return; opts.units=k; savePrefs(); refreshUI(); drawRulers(); toast('Units: '+UNITS[k].n); }
document.addEventListener('change',e=>{ if(e.target.matches&&e.target.matches('[data-upick]')) setUnits(e.target.value); });
function renderCtl(){
  const c=$('#ctlbar'); let h='';
  const fillChip=`<label title="Fill (click for swatches)">Fill <button class="chip ${style.fill==='none'?'none':''}" type="button" id="cFill" style="${chipStyle(style.fill)}"></button></label>`;
  const strokeChip=`<label title="Outline (click for swatches)">Outline <button class="chip stroke ${style.stroke==='none'?'none':''}" type="button" id="cStroke" style="${chipStyle(style.stroke)}"></button></label><input type="number" id="cSW" min="0" step="0.5" value="${r2(style.sw)}" title="Stroke weight" style="width:52px">`;
  if(tool==='magic'){
    h+=`<span class="tname">Magic Eraser</span><span class="sep"></span><label>Tolerance <input type="range" id="cTol" min="5" max="100" value="${style.tol}" style="width:120px"><span class="out" id="cTolO">${style.tol}</span></label><span class="hint">Click a colour area on the photo to remove it</span><span class="sep"></span><button class="btn" type="button" data-cmd="removeBg">✨ Remove Background</button><button class="btn" type="button" data-cmd="restoreOrig">↺ Original</button>`;
  } else if(tool==='brush'||tool==='eraser'||tool==='restore'){
    h+=`<span class="tname">${TOOLNAME[tool]}</span><span class="sep"></span><label>Size <input type="range" id="cBS" min="1" max="400" value="${style.brush.size}" style="width:110px"><input type="number" id="cBSn" min="1" max="400" value="${style.brush.size}"></label>
      <label>Hardness <input type="range" id="cBH" min="0" max="100" value="${Math.round(style.brush.hard*100)}" style="width:80px"></label><label>Opacity <input type="range" id="cBO" min="1" max="100" value="${Math.round(style.brush.opacity*100)}" style="width:80px"><span class="out" id="cBOo">${Math.round(style.brush.opacity*100)}%</span></label>`+
      (tool==='brush'?`<span class="sep"></span>${fillChip.replace('Fill','Color')}`:'')+`<span class="sep"></span><button class="btn" type="button" data-cmd="newPixel">New Layer</button><span class="hint">[ and ] change size</span>`;
  } else if(tool==='artboard'){
    const b=AB();
    h+=`<span class="tname">Artboard</span><span class="sep"></span><label>Presets <select id="cBP">${PRESETS.map(([n,w,hh],i)=>`<option value="${i}" ${w===b.w&&hh===b.h?'selected':''}>${n}</option>`).join('')}</select></label>
      <label>W <input type="number" id="cBW" step="any" value="${toU(b.w)}"></label><label>H <input type="number" id="cBH2" step="any" value="${toU(b.h)}"></label>${unitPick()}<label>Name <input type="text" id="cBN" value="${esc(b.name)}" style="width:120px"></label>
      <span class="sep"></span><button class="btn" type="button" data-cmd="addBoard">New</button><button class="btn" type="button" data-cmd="dupBoard">Duplicate</button><button class="btn" type="button" data-cmd="delBoard">Delete</button><button class="btn" type="button" data-cmd="boardOpts">Options</button><span class="hint">Drag empty canvas to add · Alt+drag moves board only</span>`;
  } else if(tool==='crop'){
    const b=AB(); h+=`<span class="tname">Crop</span><span class="sep"></span><span class="hint">Drag a rectangle to crop the active artboard (now ${b.w} × ${b.h})</span><button class="btn" type="button" data-cmd="fitBoardSel">Crop to Selection</button><button class="btn" type="button" data-cmd="fitBoardArt">Trim to Artwork</button>`;
  } else {
    h+=`<span class="tname">${tool==='select'||tool==='direct'?selTypeName():TOOLNAME[tool]}</span><span class="sep"></span>${fillChip}${strokeChip}`;
    const op=Math.round(style.opacity*100);
    h+=`<label>Opacity <input type="number" id="cOp" min="0" max="100" value="${op}" style="width:48px">%</label>`;
    const selRect=sel.length&&sel.every(e=>e.tagName==='rect');
    if(tool==='rect'||selRect) h+=`<span class="sep"></span><label>Corner <input type="number" id="cRad" min="0" step="any" value="${toU(selRect?(+sel[0].getAttribute('rx')||0):style.radius)}"></label>`;
    if(tool==='polygon') h+=`<span class="sep"></span><label>Sides <input type="number" id="cSides" min="3" max="64" value="${style.sides}"></label>`;
    if(tool==='star') h+=`<span class="sep"></span><label>Points <input type="number" id="cPoints" min="3" max="60" value="${style.points}"></label><label>Inner ratio <input type="range" id="cInner" min="10" max="95" value="${Math.round(style.inner*100)}" style="width:90px"></label>`;
    const T=textTargets();
    if(tool==='text'||T.length){
      const t=T[0]?textNode(T[0]):null; const al=T[0]&&kindOf(T[0])==='area'?areaAlign(T[0]):'left';
      h+=`<span class="sep"></span><label>Character <select id="cFont" style="width:160px">${fontOptions(style.font)}</select></label>
        <select id="cWt"><option value="400">Regular</option><option value="700" ${String(style.weight)==='700'?'selected':''}>Bold</option></select><input type="number" id="cSize" min="1" value="${style.fontSize}" title="Font size" style="width:52px">
        <span class="sep"></span>${['left','center','right','justify'].map(k=>taBtn(k,al===k)).join('')}`;
      if(T.some(e=>kindOf(e)==='area')) h+=`<span class="sep"></span><button class="btn" type="button" data-cmd="listNum" title="Numbered list: 1. → a. → 1). by level (Tab / Shift+Tab while typing)">1. a. 1)</button><button class="btn" type="button" data-cmd="listBul" title="Bulleted list">•</button><button class="ib" type="button" data-cmd="listOut" title="Decrease level">⇤</button><button class="ib" type="button" data-cmd="listIn" title="Increase level">⇥</button>`;
    }
    if(sel.length&&(tool==='select'||tool==='direct')){
      const b=selBox();
      h+=`<span class="sep"></span>${['l','ch','r','t','cv','b'].map(alBtn).join('')}<span class="sep"></span>`;
      if(b) h+=`<label>X <input type="number" id="cX" step="any" value="${toU(b.x-AB().x)}"></label><label>Y <input type="number" id="cY" step="any" value="${toU(b.y-AB().y)}"></label><label>W <input type="number" id="cW" step="any" value="${toU(b.w)}"></label><label>H <input type="number" id="cH" step="any" value="${toU(b.h)}"></label>${unitPick()}`;
      if(sel.some(e=>kindOf(e)==='frame')) h+=`<span class="sep"></span><button class="btn" type="button" data-cmd="place">Place Image</button><button class="btn" type="button" data-cmd="fitFill">Fill</button><button class="btn" type="button" data-cmd="fitFit">Fit</button>`;
    } else if(!sel.length&&tool==='select') h+=`<span class="sep"></span><button class="btn" type="button" data-cmd="docSetup">Document Setup</button><button class="btn" type="button" data-cmd="prefs">Preferences</button><span class="hint">Left-click palette = fill · right-click = outline</span>`;
    else if(!sel.length) h+=`<span class="hint">${hintFor(tool)}</span>`;
  }
  c.innerHTML=h;
  const on=(id,ev,fn)=>{const x=$('#'+id);if(x)x.addEventListener(ev,fn);};
  on('cFill','click',e=>colorPop(e.currentTarget,'fill')); on('cStroke','click',e=>colorPop(e.currentTarget,'stroke'));
  on('cFill','contextmenu',e=>{e.preventDefault();colorPop(e.currentTarget,'stroke');});
  on('cSW','input',e=>{const v=Math.max(0,+e.target.value||0);style.sw=v;sel.forEach(el=>applyAttr(el,'stroke-width',v));drawOverlay();}); on('cSW','change',()=>{if(sel.length)commit('Stroke Weight');});
  on('cOp','change',e=>{const v=clamp(+e.target.value,0,100)/100;style.opacity=v;sel.forEach(el=>{if(v>=1)el.removeAttribute('opacity');else el.setAttribute('opacity',v);});if(sel.length)commit('Opacity');});
  on('cRad','input',e=>{const v=Math.max(0,fromU(e.target.value));style.radius=v;sel.filter(x=>x.tagName==='rect').forEach(x=>{if(v){x.setAttribute('rx',v);x.setAttribute('ry',v);}else{x.removeAttribute('rx');x.removeAttribute('ry');}});drawOverlay();});
  on('cRad','change',()=>{if(sel.length)commit('Corner Radius');});
  on('cTol','input',e=>{style.tol=+e.target.value;$('#cTolO').textContent=style.tol;});
  on('cSides','input',e=>{style.sides=clamp(+e.target.value||6,3,64);});
  on('cPoints','input',e=>{style.points=clamp(+e.target.value||5,3,60);});
  on('cInner','input',e=>{style.inner=+e.target.value/100;});
  on('cFont','change',e=>{style.font=e.target.value;if(setTextProp('font-family',style.font))commit('Font');else refreshPanels();});
  on('cWt','change',e=>{style.weight=e.target.value;if(setTextProp('font-weight',style.weight))commit('Font Style');});
  on('cSize','change',e=>{style.fontSize=Math.max(1,+e.target.value||16);if(setTextProp('font-size',style.fontSize))commit('Font Size');else refreshPanels();});
  c.querySelectorAll('[data-ta]').forEach(b=>b.addEventListener('click',()=>{if(setTextProp('align',b.dataset.ta))commit('Paragraph Align');}));
  c.querySelectorAll('[data-al]').forEach(b=>b.addEventListener('click',()=>alignSel(b.dataset.al)));
  const tf=()=>{ const b=selBox(); if(!b) return; const o=AB(); let x=fromU($('#cX').value)+o.x, y=fromU($('#cY').value)+o.y, w=Math.max(.1,fromU($('#cW').value)), hh=Math.max(.1,fromU($('#cH').value));
    const sx=b.w?w/b.w:1, sy=b.h?hh/b.h:1; const MM=new DOMMatrix().translate(x,y).scale(sx,sy).translate(-b.x,-b.y); const d={}; sel.forEach(el=>{const m0=getM(el); if(!resizeBoxEl(el,m0,MM,d)) setM(el,MM.multiply(m0));}); commit('Transform'); };
  ['cX','cY','cW','cH'].forEach(id=>on(id,'change',tf));
  on('cBS','input',e=>{style.brush.size=+e.target.value;$('#cBSn').value=e.target.value;syncBrushPanel();}); on('cBSn','change',e=>{style.brush.size=clamp(+e.target.value,1,400);$('#cBS').value=style.brush.size;syncBrushPanel();});
  on('cBH','input',e=>{style.brush.hard=+e.target.value/100;syncBrushPanel();}); on('cBO','input',e=>{style.brush.opacity=+e.target.value/100;$('#cBOo').textContent=e.target.value+'%';syncBrushPanel();});
  on('cBP','change',e=>{const p=PRESETS[+e.target.value]; if(p&&p[1]){Object.assign(AB(),{w:p[1],h:p[2]});renderBoards();commit('Artboard Size');fit();}});
  on('cBW','change',e=>{AB().w=Math.max(1,fromU(e.target.value));renderBoards();commit('Artboard Size');}); on('cBH2','change',e=>{AB().h=Math.max(1,fromU(e.target.value));renderBoards();commit('Artboard Size');});
  on('cBN','change',e=>{AB().name=e.target.value||AB().name;commit('Rename Artboard');});
}

  const tChange=()=>{

    const ch=document.activeElement&&document.activeElement.id;
    if($('#tLock').checked&&b.w&&b.h){ if(ch==='tW') h=b.h*w/b.w; else if(ch==='tH') w=b.w*h/b.h; }
    const MM=new DOMMatrix().translate(x,y).scale(b.w?w/b.w:1,b.h?h/b.h:1).translate(-b.x,-b.y);
    const d={}; sel.forEach(el=>{const m0=getM(el); if(!resizeBoxEl(el,m0,MM,d)) setM(el,MM.multiply(m0));}); commit('Transform');

  else if((m=line.match(/^>\s?(.*)$/))){ st=findPStyle('Quote'); text=m[1]; }
  else if((m=line.match(/^\{([^}]+)\}\s?(.*)$/))&&findPStyle(m[1].trim())){ st=findPStyle(m[1].trim()); text=m[2]; }

  else if((m=text.match(MANUAL_MARK_RE))){ bullet=m[1]; text=m[2]; }
  const s={...base};
  if(st) Object.assign(s,{font:st.font,size:st.size,weight:st.weight,lead:st.lead,color:st.color,align:(st.align&&st.align!=='auto')?st.align:base.align,indent:st.indent||0,before:st.before||0,after:st.after||0,italic:!!st.italic,ls:0});

const fontOf=(st,w)=>`${(w&&w.i)||st.italic?'italic ':''}${w&&w.b?700:st.weight} ${st.size}px "${st.font}"`;

/* replaces the simple single-frame layout */
function layoutArea(g){ if(!g||!g.isConnected||kindOf(g)!=='area') return; layoutStory(storyHead(g)); }
function layoutStory(head){
  const frames=storyFrames(head), text=head.dataset.text||'', base=baseStyleOf(head);
  const rtl=head.dataset.dir==='rtl'||(head.dataset.dir!=='ltr'&&isRTL(text));
  frames.forEach((f,i)=>{ if(i){ delete f.dataset.text; } });
  const cols=[];
  frames.forEach(f=>{ const r=f.querySelector('rect'); const x=+r.getAttribute('x'),y=+r.getAttribute('y'),w=+r.getAttribute('width'),h=+r.getAttribute('height');
    const ins=+f.dataset.inset||0, n=clamp(+f.dataset.cols||1,1,6), gut=+f.dataset.gut||12, iw=Math.max(1,w-ins*2), cw=Math.max(1,(iw-gut*(n-1))/n);
    for(let c=0;c<n;c++){ const ci=rtl?n-1-c:c; cols.push({f,x:x+ins+ci*(cw+gut),y:y+ins,w:cw,h:Math.max(0,h-ins*2)}); } });
  const out=new Map(frames.map(f=>[f,[]])); const headings=[];
  let ci=0, col=cols[0], y=0, overset=false;
  const nextCol=frameBreak=>{ if(frameBreak&&col){ const f=col.f; while(ci<cols.length&&cols[ci].f===f) ci++; } else ci++; col=cols[ci]; y=0; return !!col; };
  const cnt=[];
  outer: for(const p of text.split('\n').map(l=>parsePara(l,base))){
    if(!col){ overset=true; break; }
    if(p.brk){ if(y>0) nextCol(true); continue; }
    if(p.kind[0]==='h') cnt.length=0;
    if(p.auto==='num'){ cnt.length=p.level+1; cnt[p.level]=p.start!=null?p.start:(cnt[p.level]||0)+1; p.bullet=numMark(p.level,cnt[p.level]); }
    else if(p.bullet) cnt.length=p.level+1;
    p.rtl=head.dataset.dir==='rtl'?true:head.dataset.dir==='ltr'?false:(p.plain.trim()?isRTL(p.plain):rtl);
    if(p.st.align==='auto') p.st={...p.st,align:p.rtl?'right':'left'};
    const st=p.st, lh=st.size*st.lead;
    if(y>0) y+=st.before;
    if(p.tab){ if(y+lh>col.h+0.01&&!nextCol()){overset=true;break;} out.get(col.f).push({col,y,st,tab:p.tab,runs:p.runs,rtl:p.rtl}); y+=lh+st.after; continue; }
    const words=[];
    p.runs.forEach(r=>r.t.split(/(\s+)/).forEach(w=>{ if(!w) return; if(/^\s+$/.test(w)) return; words.push({t:w,b:r.b,i:r.i}); }));
    words.forEach(w=>w.w=measW(st,w,w.t));
    const spW=measW(st,null,' '), tabW=Math.max(st.size*1.7,measW(st,null,'00).')+st.size*0.45), lvOff=(p.level||0)*tabW;
    const bulletW=p.bullet?Math.max(tabW,measW(st,null,p.bullet)+st.size*0.45):0;   /* markers sit on a tab stop, so list text lines up */
    if(!words.length){ if(y+lh>col.h+0.01&&!nextCol()){overset=true;break;} y+=lh*0.6; continue; }
    let i=0, first=true;
    while(i<words.length){
      if(y+lh>col.h+0.01){ if(!nextCol()){ overset=true; break outer; } }
      const ind=(first?st.indent:0)+lvOff+bulletW, avail=col.w-ind, line=[]; let lw=0;
      while(i<words.length){ const w=words[i], add=(line.length?spW:0)+w.w; if(line.length&&lw+add>avail+0.01) break; line.push(w); lw+=add; i++; if(lw>avail) break; }
      out.get(col.f).push({col,y,st,line,lw,ind,first,last:i>=words.length,bullet:first?p.bullet:null,bulletW,spW,firstInd:(first?st.indent:0)+lvOff,rtl:p.rtl});
      if(first&&p.kind[0]==='h') headings.push({level:+p.kind[1],text:p.plain,frame:col.f});
      first=false; y+=lh;
    }
    y+=st.after;
  }
  frames.forEach(f=>{ renderFrame(f,out.get(f)); f.dataset.overset='0'; });
  frames[frames.length-1].dataset.overset=overset?'1':'0';
  storyHeadings.set(head.id,headings);
}
function renderFrame(f,lines){
  const t=f.querySelector('text'); t.replaceChildren(); t.removeAttribute('direction'); t.removeAttribute('text-anchor');
  let rtl=false;
  /* each word is placed explicitly; RTL words are anchored at their right edge and wrapped in an RTL embedding so punctuation lands correctly */
  const put=(x,yb,st,w,txt)=>{ const ts=mkNS('tspan',{x:r2(x),y:r2(yb),'text-anchor':rtl?'end':null,'font-family':st.font,'font-size':st.size,'font-weight':w&&w.b?700:(st.weight!=='400'?st.weight:null),'font-style':(w&&w.i)||st.italic?'italic':null,fill:st.color,'letter-spacing':st.ls||null}); ts.textContent=rtl?'‫'+txt+'‬':txt; t.appendChild(ts); };
  const X=(c,off)=>rtl?c.x+c.w-off:c.x+off;
  lines.forEach(L=>{
    rtl=!!L.rtl;
    const st=L.st, c=L.col, yb=c.y+L.y+st.size*0.88+(st.size*st.lead-st.size)*0.3;
    if(L.tab){
      const left=L.runs.map(r=>r.t).join(''), lw=measW(st,null,left), rw=measW(st,null,L.tab[1]), dot=measW(st,null,' .');
      put(X(c,0),yb,st,null,left); put(X(c,c.w-rw),yb,st,null,L.tab[1]);
      const n=Math.floor((c.w-lw-rw-st.size)/dot); if(n>0) put(X(c,lw+st.size*0.5),yb,{...st,color:'#999999'},null,' .'.repeat(n));
      return;
    }
    let align=st.align; if(align==='justify'&&L.last) align=rtl?'right':'left';
    const spare=c.w-L.ind-L.lw; let gap=L.spW, off=0;
    const toEnd=(align==='right'&&!rtl)||(align==='left'&&rtl);
    if(align==='center') off=spare/2; else if(toEnd) off=spare; else if(align==='justify'&&L.line.length>1) gap=L.spW+spare/(L.line.length-1);
    if(L.bullet) put(X(c,L.firstInd+(toEnd?off:align==='center'?off:0)),yb,st,null,L.bullet);
    let cur=L.ind+off;
    L.line.forEach(w=>{ put(X(c,cur),yb,st,w,w.t); cur+=w.w+gap; });
  });
}

/* ---------- threading ---------- */
function threadFrames(a,b){
  const ha=storyHead(a), hb=storyHead(b); if(ha===hb){toast('Those frames are already in the same story');return false;}
  const tail=storyFrames(ha).pop(); const extra=(hb.dataset.text||'').trim();
  if(extra) ha.dataset.text=(ha.dataset.text||'')+'\n'+extra;
  const bt=hb.querySelector('text'), at=ha.querySelector('text'); ['font-family','font-size','font-weight','fill','letter-spacing'].forEach(k=>setA(bt,k,at.getAttribute(k)));
  tail.dataset.next=hb.id; hb.dataset.prev=tail.id; delete hb.dataset.text; layoutStory(ha); return true;
}
function threadSel(){
  const A=sortDoc(sel.filter(e=>kindOf(e)==='area')); if(A.length<2){toast('Select two or more text frames (first = start of story)');return;}
  const order=sel.filter(e=>kindOf(e)==='area'); for(let i=1;i<order.length;i++) threadFrames(order[i-1],order[i]); commit('Thread Frames'); toast('Frames threaded — text now flows between them');
}
function unthread(){
  const f=sel.find(e=>kindOf(e)==='area'); if(!f){toast('Select a text frame');return;}
  const head=storyHead(f), n=byId(f.dataset.next);
  if(n){ delete f.dataset.next; delete n.dataset.prev; n.dataset.text=''; layoutStory(n); }
  else if(f.dataset.prev){ const p=byId(f.dataset.prev); if(p) delete p.dataset.next; delete f.dataset.prev; f.dataset.text=''; layoutStory(f); }
  layoutStory(head); commit('Unthread'); toast('Thread broken after this frame');
}
function unlinkOnDelete(el){
  if(kindOf(el)!=='area') return; const p=byId(el.dataset.prev), n=byId(el.dataset.next);
  if(p&&n){ p.dataset.next=n.id; n.dataset.prev=p.id; }
  else if(p){ delete p.dataset.next; }
  else if(n){ delete n.dataset.prev; n.dataset.text=el.dataset.text||''; }
  setTimeout(()=>{ const h=p?storyHead(p):n; if(h&&h.isConnected) layoutStory(h); },0);
}
function marginBox(i){ const b=doc.boards[i], m=doc.margins; let l=m.l, r=m.r; if(m.mirror&&i%2===1){ l=m.r; r=m.l; } return {x:b.x+l,y:b.y+m.t,w:Math.max(20,b.w-l-r),h:Math.max(20,b.h-m.t-m.b)}; }
function newPageAfter(){
  const last=doc.boards[doc.boards.length-1], first=doc.boards[0], perRow=8, n=doc.boards.length;
  const nb=n%perRow===0?{x:first.x,y:last.y+last.h+70}:{x:last.x+last.w+40,y:last.y};
  doc.boards.push({x:nb.x,y:nb.y,w:last.w,h:last.h,name:'Page '+(n+1)}); return doc.boards.length-1;
}
function cloneAreaSettings(from,to){
  ['cols','gut','inset','lead','align','dir','indent','sa'].forEach(k=>{ if(from.dataset[k]!==undefined) to.dataset[k]=from.dataset[k]; });
  const ft=from.querySelector('text'), tt=to.querySelector('text'); ['font-family','font-size','font-weight','fill','letter-spacing'].forEach(k=>setA(tt,k,ft.getAttribute(k)));
}
function autoFlow(g,silent){

}
function autoflowSel(){ const f=sel.find(e=>kindOf(e)==='area'); if(!f){toast('Select a text frame');return;} autoFlow(f); }

/* ---------- table of contents ---------- */
function boardOfEl(el){ const b=bboxOf(el); if(!b) return 0; const i=boardAt({x:b.x+b.w/2,y:b.y+b.h/2}); return i<0?0:i; }
/* pages laid out in a grid; inserting / moving pages carries each page's artwork along */
function pageMembers(){ return new Map(doc.boards.map(b=>[b,items().filter(el=>{ const bb=bboxOf(el); if(!bb) return false; const cx=bb.x+bb.w/2, cy=bb.y+bb.h/2; return cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h; })])); }
function layoutPagesGrid(mem){
  const W=Math.max(...doc.boards.map(b=>b.w)), H=Math.max(...doc.boards.map(b=>b.h)), perRow=8;
  doc.boards.forEach((b,i)=>{ const tx=(i%perRow)*(W+40), ty=Math.floor(i/perRow)*(H+70), dx=tx-b.x, dy=ty-b.y; if(dx||dy){ (mem.get(b)||[]).forEach(el=>setM(el,new DOMMatrix().translate(dx,dy).multiply(getM(el)))); b.x=tx; b.y=ty; } });
  doc.boards.forEach((b,i)=>{ if(/^(Page|Artboard) \d+$/.test(b.name)||!b.name) b.name=(doc.margins.on?'Page ':'Artboard ')+(i+1); });
  renderBoards();
}
function insertPageAt(k,noCommit){
  const mem=pageMembers(), t=doc.boards[Math.min(k,doc.boards.length-1)]||AB();
  const nb={x:-99999,y:-99999,w:t.w,h:t.h,name:''}; doc.boards.splice(k,0,nb); layoutPagesGrid(mem); doc.ab=k;
  relayoutAll(); if(!noCommit){ commit('Insert Page'); fit(); } return k;
}
function movePage(d){
  const i=doc.ab, j=i+d; if(j<0||j>=doc.boards.length) return; const mem=pageMembers();
  [doc.boards[i],doc.boards[j]]=[doc.boards[j],doc.boards[i]]; layoutPagesGrid(mem); doc.ab=j; relayoutAll(); commit('Move Page'); fit();
}
function generateTOC(){
  let existing=items().find(e=>kindOf(e)==='area'&&e.dataset.toc);
  if(!existing){ const busy=items().some(e=>kindOf(e)==='area'&&!e.dataset.toc&&boardOfEl(e)===doc.ab); if(busy){ insertPageAt(doc.ab,true); toast('Inserted a new page for the table of contents'); } }
  const heads=items().filter(e=>isStoryHead(e)&&!e.dataset.toc); heads.forEach(layoutStory);
  const list=[]; heads.forEach(h=>(storyHeadings.get(h.id)||[]).forEach(x=>{ if(x.level<=2) list.push({...x,page:boardOfEl(x.frame)}); }));
  if(!list.length){toast('No headings found. Start chapter lines with # (or ## for sections) in your text frames.');return;}
  list.sort((a,b)=>a.page-b.page);

  const rtl=isRTL(list[0].text);
  const txt=`# ${rtl?'المحتويات':'Contents'}\n`+list.map(x=>`${x.level===2?'    ':''}${x.level===1?'**'+x.text+'**':x.text}\t${num(x.page)}`).join('\n');
  let f=existing;
  if(!f){ const mb=marginBox(doc.ab); f=createArea(mb.x,mb.y,mb.w,mb.h,''); const any=heads[0]; if(any) cloneAreaSettings(any,f); f.dataset.toc='1'; f.dataset.name='Table of Contents'; content.appendChild(f); }
  f.dataset.text=txt; layoutStory(f); sel=[f]; commit('Table of Contents'); toast(`Table of contents: ${list.length} entries`);
}

/* ---------- import manuscript (.txt .md .docx) ---------- */
function htmlToMarkup(html){
  const d=new DOMParser().parseFromString(html,'text/html'); const out=[];
  const inl=n=>[...n.childNodes].map(c=>c.nodeType===3?c.textContent:(/^(STRONG|B)$/.test(c.tagName)?'**'+inl(c)+'**':/^(EM|I)$/.test(c.tagName)?'*'+inl(c)+'*':c.tagName==='BR'?' ':inl(c))).join('');
  d.body.querySelectorAll('h1,h2,h3,h4,p,li,blockquote,table').forEach(n=>{
    if(n.closest('li')&&n.tagName!=='LI') return; if(n.closest('blockquote')&&n.tagName!=='BLOCKQUOTE') return;
    const t=inl(n).replace(/\s+/g,' ').trim(); if(!t&&n.tagName!=='P') return;
    if(n.tagName==='H1') out.push('# '+t); else if(n.tagName==='H2') out.push('## '+t); else if(/^H[34]$/.test(n.tagName)) out.push('### '+t);
    else if(n.tagName==='LI') out.push((n.parentNode.tagName==='OL'?([...n.parentNode.children].indexOf(n)+1)+'. ':'• ')+t);
    else if(n.tagName==='BLOCKQUOTE') out.push('> '+t); else if(n.tagName==='TABLE') out.push(t); else out.push(t);
  });
  return out.join('\n').replace(/\n{3,}/g,'\n\n');
}
async function readManuscript(f){
  const n=f.name.toLowerCase();
  if(n.endsWith('.docx')){ toast('Reading Word document…'); await loadScript(MAMMOTH_URL); const r=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()}); return htmlToMarkup(r.value); }
  if(n.endsWith('.html')||n.endsWith('.htm')) return htmlToMarkup(await f.text());
  return (await f.text()).replace(/\r\n?/g,'\n');
}
function pickFile(accept){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept=accept; i.onchange=()=>res(i.files[0]||null); i.click(); }); }
async function importText(){
  const f=await pickFile('.txt,.md,.markdown,.docx,.html,.htm'); if(!f) return;
  let txt; try{ txt=await readManuscript(f); }catch(e){ toast('Could not read that file'+(f.name.endsWith('.docx')?' (Word reader needs internet)':'')); return; }
  let g=sel.find(e=>kindOf(e)==='area');
  if(g){ g=storyHead(g); g.dataset.text=(g.dataset.text?g.dataset.text+'\n':'')+txt; }
  else { const mb=marginBox(doc.ab); g=createArea(mb.x,mb.y,mb.w,mb.h,txt); g.dataset.align='justify'; g.querySelector('text').setAttribute('font-size',12); g.dataset.lead='1.5'; g.dataset.name=f.name.replace(/\.[^.]+$/,''); content.appendChild(g); }
  sel=[g]; autoFlow(g,true); commit('Import Text'); toast(`Imported ${txt.split(/\s+/).length} words into ${storyFrames(g).length} frame(s)`); fit();
}

  await new Promise(r=>tx.oncomplete=r); const all=await recentAll(); if(all.length>RECENT_MAX){ const t2=db.transaction('recent','readwrite'); all.slice(RECENT_MAX).forEach(x=>t2.objectStore('recent').delete(x.id)); } }catch(e){} }
async function recentDel(id){ try{ const db=await idb(); const tx=db.transaction('recent','readwrite'); tx.objectStore('recent').delete(id); await new Promise(r=>tx.oncomplete=r); }catch(e){} }
let recentT=null;
function scheduleRecent(){ clearTimeout(recentT); recentT=setTimeout(()=>{ if(!content.children.length) return; const s=snap(); recentPut({id:s.id,name:doc.name||'Untitled',time:Date.now(),snap:s}); },1500); }

/* small picture of a document's first artboard, drawn from its snapshot */
function snapThumb(s){
  const b=(s.boards&&s.boards[0])||{x:0,y:0,w:800,h:600};
  const svgTxt=`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${b.w}" height="${b.h}" viewBox="${b.x} ${b.y} ${b.w} ${b.h}"><defs>${s.defs||''}</defs><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="${s.bg==='transparent'?'#fff':(s.bg||'#fff')}"/>${s.html||''}</svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgTxt);
}
function openSnap(s){
  if(pen) penFinish(); exitIso(true);
  restore(s); doc.id=s.id||newDocId();
  hist.splice(0); hist.push({...snap(),label:'Open'}); hi=0; fit(); refreshUI(); toast('Opened '+doc.name);
}
function quickNew(w,h,n,layout,name){
  if(pen) penFinish(); exitIso(true); doc.id=null; content.replaceChildren(); userDefs.replaceChildren(); sel=[];
  doc.boards=Array.from({length:n},(_,i)=>({x:i*(w+40),y:0,w,h,name:(layout?'Page ':'Artboard ')+(i+1)})); doc.ab=0; doc.bg='#ffffff'; doc.guides=[];
  doc.name=name; doc.margins.on=!!layout; delete doc.margins.byWs;
  renderBoards(); commit('New Document'); fit(); toast('New document: '+name);
}

function runFormat(k,nm,o={}){
  const bi=o.board===undefined?doc.ab:o.board;
  if(k==='svg'){ download(new Blob([buildSVG('all',true)],{type:'image/svg+xml'}),nm+'.svg'); save(); }
  else if(k==='pdfv') exportPDFVector(nm,!!o.keepText);
  else if(k==='pdf') exportPDF(nm,o.q||2.5);
  else if(k==='psd') exportPSD(nm,bi);
  else if(k==='png') svgToPng(bi,o.scale||2).then(r=>download(r.blob,nm+'.png')).catch(()=>toast('Could not render PNG'));
}

  else if(kind==='star') f.push(['ssR','Radius 1',toU(L.r),U],['ssR2','Radius 2',toU(L.r2),U],['ssN','Points',style.points,'',1]);
  else if(kind==='line') f.push(['ssL','Length',toU(L.len),U],['ssA','Angle',L.ang,'°']);
  const title={rect:'Rectangle',ellipse:'Ellipse',frame:'Frame',polygon:'Polygon',star:'Star',line:'Line Segment'}[kind]||'Shape';
  const v=id=>+$('#'+id).value;
  openModal(title,f.map(([id,l,val,u,step])=>`<div class="row"><span class="lbl" style="width:90px">${l}</span><input type="number" id="${id}" value="${val}" step="${step||'any'}" min="0" style="width:90px"><span class="muted">${u||''}</span></div>`).join(''),{size:'narrow',onOk:()=>{
    const el=createShape(kind,q), d={el,p0:q,kind};
    if(kind==='rect'||kind==='ellipse'||kind==='frame'){ L.w=Math.max(1,fromU(v('ssW'))); L.h=Math.max(1,fromU(v('ssH'))); content.appendChild(el); updateShape(d,{x:q.x+L.w,y:q.y+L.h},false); }
    else if(kind==='line'){ L.len=Math.max(1,fromU(v('ssL'))); L.ang=v('ssA')||0; const a=-L.ang*Math.PI/180; content.appendChild(el); updateShape(d,{x:q.x+Math.cos(a)*L.len,y:q.y+Math.sin(a)*L.len},false); }
    else { L.r=Math.max(1,fromU(v('ssR'))); if(kind==='star'){ L.r2=Math.max(0.5,fromU(v('ssR2'))); style.points=clamp(v('ssN')|0,3,60); style.inner=clamp(L.r2/L.r,0.05,2); } else style.sides=clamp(v('ssN')|0,3,64);
      content.appendChild(el); updateShape(d,{x:q.x,y:q.y-L.r},true); }
    sel=[el]; commit(NAMES[kind]||title); }});
  setTimeout(()=>{const i=$('#mBody input');if(i){i.focus();i.select();}},0);
}

function boardOptionsDialog(i){

  openModal('Artboard Options',`<div class="row"><span class="lbl">Name</span><input type="text" id="boN" value="${esc(b.name)}" style="flex:1"></div>
    <div class="row"><span class="lbl">Preset</span><select id="boP" style="flex:1">${PRESETS.map(([n,w,h],k)=>`<option value="${k}" ${w===b.w&&h===b.h?'selected':''}>${n}</option>`).join('')}</select></div>
    <div class="g2"><label class="fld"><span>W (${uL()})</span><input type="number" id="boW" value="${toU(b.w)}" min="0" step="any"></label><label class="fld"><span>H (${uL()})</span><input type="number" id="boH" value="${toU(b.h)}" min="0" step="any"></label><label class="fld"><span>X (${uL()})</span><input type="number" id="boX" value="${toU(b.x)}" step="any"></label><label class="fld"><span>Y (${uL()})</span><input type="number" id="boY" value="${toU(b.y)}" step="any"></label></div>`,{size:'narrow',onOk:()=>{

    }});
  $('#boP').addEventListener('change',e=>{const p=PRESETS[+e.target.value]; if(p[1]){$('#boW').value=toU(p[1]);$('#boH').value=toU(p[2]);}});

function areaOptionsDialog(){
  const A=sel.filter(el=>kindOf(el)==='area'); if(!A.length){toast('Select a text frame');return;} const g=A[0];
  openModal('Area Type Options',`<div class="g2"><label class="fld"><span>Columns</span><input type="number" id="aoC" min="1" max="6" value="${g.dataset.cols||1}"></label><label class="fld"><span>Gutter (${uL()})</span><input type="number" id="aoG" min="0" step="any" value="${toU(g.dataset.gut||12)}"></label>

    <div class="row"><span class="lbl">Align</span><select id="aoA"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select><span class="lbl">Direction</span><select id="aoD"><option value="">Auto</option><option value="ltr">Left to right</option><option value="rtl">Right to left</option></select></div>`,{size:'narrow',onOk:()=>{
      A.forEach(el=>{el.dataset.cols=clamp(+$('#aoC').value|0,1,6);el.dataset.gut=r2(Math.max(0,fromU($('#aoG').value)));el.dataset.inset=r2(Math.max(0,fromU($('#aoI').value)));el.dataset.lead=clamp(+$('#aoL').value,0.6,4);el.dataset.align=$('#aoA').value; if($('#aoD').value)el.dataset.dir=$('#aoD').value; else delete el.dataset.dir; layoutArea(el);}); commit('Area Type Options');
    }});
  $('#aoA').value=areaAlign(g); $('#aoD').value=g.dataset.dir||'';
}
function marginsDialog(){
  const m=doc.margins;
  openModal('Margins and Columns',`<label class="chk"><input type="checkbox" id="mgOn" ${m.on?'checked':''}> Show margins & columns</label>
    <div class="g2"><label class="fld"><span>Top (${uL()})</span><input type="number" id="mgT" value="${toU(m.t)}" min="0" step="any"></label><label class="fld"><span>Bottom (${uL()})</span><input type="number" id="mgB" value="${toU(m.b)}" min="0" step="any"></label><label class="fld"><span>Left (${uL()})</span><input type="number" id="mgL" value="${toU(m.l)}" min="0" step="any"></label><label class="fld"><span>Right (${uL()})</span><input type="number" id="mgR" value="${toU(m.r)}" min="0" step="any"></label>
    <label class="fld"><span>Columns</span><input type="number" id="mgC" value="${m.cols}" min="1" max="12"></label><label class="fld"><span>Gutter (${uL()})</span><input type="number" id="mgG" value="${toU(m.gut)}" min="0" step="any"></label></div>
    <p class="muted" style="margin:0">Applies to every page. Objects snap to margins; Align panel can align to margins.</p>`,{size:'narrow',onOk:()=>{
      Object.assign(doc.margins,{on:$('#mgOn').checked,t:r2(fromU($('#mgT').value)),b:r2(fromU($('#mgB').value)),l:r2(fromU($('#mgL').value)),r:r2(fromU($('#mgR').value)),cols:clamp(+$('#mgC').value|0,1,12),gut:r2(fromU($('#mgG').value))}); commit('Margins and Columns');

}
function guidesDialog(){
  openModal('Create Guides',`<div class="g2"><label class="fld"><span>Rows</span><input type="number" id="cgR" value="2" min="0" max="20"></label><label class="fld"><span>Columns</span><input type="number" id="cgC" value="2" min="0" max="20"></label></div><label class="chk"><input type="checkbox" id="cgM" checked> Fit to margins (else page)</label><label class="chk"><input type="checkbox" id="cgX"> Remove existing guides</label>`,{size:'narrow',onOk:()=>{
    const b=AB(), m=doc.margins, fm=$('#cgM').checked&&m.on; const x=b.x+(fm?m.l:0), y=b.y+(fm?m.t:0), w=b.w-(fm?m.l+m.r:0), h=b.h-(fm?m.t+m.b:0);
    if($('#cgX').checked) doc.guides=[]; const R=+$('#cgR').value|0, C=+$('#cgC').value|0;
    for(let i=1;i<R;i++) doc.guides.push({y:r2(y+h*i/R)}); for(let i=1;i<C;i++) doc.guides.push({x:r2(x+w*i/C)});
    opts.guides=true; commit('Create Guides');
  }});
}
function workspaceDialog(){
  openModal('Workspaces',`<p class="muted" style="margin:0">One app, three ways of working. Every tool stays available — a workspace only rearranges the panels.</p><div class="wsgrid">${Object.keys(WS).map(k=>`<button type="button" data-ws="${k}" style="${ws===k?'border-color:var(--accent)':''}"><b>${WS[k].label}</b><small>${WS[k].desc}</small></button>`).join('')}</div>`);
  $$('[data-ws]').forEach(b=>b.addEventListener('click',()=>{setWorkspace(b.dataset.ws);closeModal();toast(WS[b.dataset.ws].label+' workspace');}));

function helpDialog(){
  const sec=(t,rows)=>`<h5>${t}</h5>`+rows.map(([a,b])=>`<div><span>${esc(a)}</span><kbd>${esc(b)}</kbd></div>`).join('');
  const tools=[]; TOOLGROUPS.forEach(g=>{if(g!=='div')g.forEach(t=>tools.push([t[2].replace(/\s+\(.*$/,''),t[1]||'—']));});
  const menu=[]; const walk=(list,pre)=>list.forEach(it=>{if(it===SEP)return; if(it.sub) walk(it.sub,pre+it.l+' › '); else if(it.k) menu.push([pre+it.l.replace(/\s+$/,''),it.k]);}); MENUS.forEach(m=>walk(menuItems(m),m+' › '));
  openModal('Keyboard Shortcuts',`<div class="keys">${sec('Colour (CorelDRAW-style)',[['Fill colour','Left-click palette swatch'],['Outline colour','Right-click palette swatch'],['Remove fill / outline','Left / right-click ⊘'],['Toggle Fill ↔ Outline','X'],['Swap fill & outline','Shift+X'],['Default colours','D'],['No fill','/']])}
    ${sec('Tools',tools)}${sec('Editing',[['Pan','Space+drag / H'],['Zoom at cursor','Ctrl+scroll'],['Nudge 1 / 10','Arrows / Shift+Arrows'],['Constrain','Shift'],['From centre','Alt'],['Duplicate while moving','Alt+drag'],['Finish pen path','Enter / Esc'],['Edit anchors','Double-click path'],['Brush size','[ / ]'],['Hide panels','Tab']])}${sec('Menus',menu)}</div>`,{size:'wide'});
}

  openModal('Quick Tour',`<ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;line-height:1.45">
    <li><b>Menus</b> along the top work like the classic desktop design apps: File, Edit, Object, Type, Select, Effect, Image, Layout, View, Window, Help.</li>

    <li><b>Photo</b>: Brush (B) creates a pixel layer automatically; Eraser (E) erases it. Image › Adjustments for brightness, hue and more.</li></ol>`,{size:'wide'});

function aboutDialog(){ openModal('About Garis Vektor',`<p style="margin:0;line-height:1.5">Garis Vektor is an independent browser-based design tool combining vector illustration, page layout and photo painting in one window. It is not affiliated with Adobe, Corel or any other vendor.</p><p class="muted" style="margin:0">Saves as SVG · exports PNG and PDF · works offline after loading (Pathfinder and PDF need one-time library download).</p>`,{size:'narrow'}); }

/* ---------- boot ---------- */
loadPrefs(); applyUI(); detectSystemFonts();
doc.pstyles=JSON.parse(JSON.stringify(DEFAULT_PSTYLES));
buildTools(); buildPalette(); renderMenuBar();
const saved=load();
if(saved){
  content.innerHTML=saved.html; userDefs.innerHTML=saved.defs||''; doc.boards=saved.boards||[{x:0,y:0,w:saved.w||800,h:saved.h||600,name:'Artboard 1'}]; doc.ab=Math.min(saved.ab||0,doc.boards.length-1);
  doc.bg=saved.bg||'#ffffff'; doc.name=saved.name||'Untitled-1'; doc.id=saved.id||null; doc.guides=saved.guides||[]; if(saved.margins) doc.margins={...doc.margins,...saved.margins}; if(saved.pstyles) doc.pstyles=saved.pstyles; if(saved.master) doc.master=saved.master;
  refreshUid(); renderBoards(); hist.push({...snap(),label:'Open'}); hi=0;
} else {
  const d=new DOMParser().parseFromString(SAMPLE,'image/svg+xml');
  [...d.documentElement.children].forEach(n=>{const node=document.importNode(n,true);(n.localName==='defs'?userDefs:content).appendChild(node);});
  // place the Arabic title so its right edge sits at x=400 (RTL anchor)
  const at=content.querySelector('#o10'); if(at){ at.setAttribute('x','405'); at.removeAttribute('text-anchor'); }
  doc.name='Senja di Lembah'; refreshUid(); renderBoards(); hist.push({...snap(),label:'Open'}); hi=0; save();
}
setWorkspace(ws,true);
$$('.tool').forEach(b=>b.classList.toggle('on',b.dataset.tool===tool));
$('#stHint').textContent=hintFor(tool);
renderCtl(); refreshUI();
requestAnimationFrame(()=>{fit(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{relayoutAll();drawOverlay();refreshUI();});});
let rzT=null; window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{drawRulers();drawOverlay();},60);});
/* keep the artboard centred when the canvas area changes size (window maximised after start, panels shown/hidden):
   until the user pans or zooms, the view is re-fitted; afterwards the centre of the view stays put */
let lastCanvasSize=null;
new ResizeObserver(()=>{ const r=svg.getBoundingClientRect(); if(!r.width||!r.height) return;
  if(lastCanvasSize&&(lastCanvasSize.w!==r.width||lastCanvasSize.h!==r.height)){
    if(viewAuto) fit(); else { pan.x+=(r.width-lastCanvasSize.w)/2; pan.y+=(r.height-lastCanvasSize.h)/2; applyView(); } }
  lastCanvasSize={w:r.width,h:r.height}; }).observe(svg);

/* ---------- offline: cache the app (works when served over http/https, e.g. on a tablet) ---------- */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});

})();
